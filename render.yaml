services:
  - type: cron
    name: daily-medicine-paper-brief-daily-pipeline
    runtime: python
    region: singapore
    schedule: "30 22 * * *"
    buildCommand: "pip install -r workers/requirements.txt"
    startCommand: "python -m workers.render_daily"
    envVars:
      - key: TZ
        value: Asia/Taipei
      - key: PUBLICATION_MODE
        value: auto_publish
      - key: MVP_SOURCES
        value: pubmed,crossref,unpaywall
      - key: DAILY_AI_LIMIT
        value: "10"
      - key: SUPABASE_URL
        value: https://fkucugazszaugtfvbvzr.supabase.co
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: TTS_PROVIDER
        value: openai
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: marin
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PODCAST_AUDIO_BUCKET
        value: podcast-audio
      - key: PODCAST_VIDEO_BUCKET
        value: podcast-videos
      - key: VIDEO_FONT_PATH
        value: workers/assets/NotoSansCJKtc-Regular.otf
      - key: UNPAYWALL_EMAIL
        value: captain.balung@gmail.com
      - key: CROSSREF_MAILTO
        value: captain.balung@gmail.com
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
